[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Production-style RAG built from scratch: hybrid retrieval, permissions, safe caching, outbox and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "redis",
    "qdrant-client",
    "opensearch-py[async]",
    "httpx",
    "sentence-transformers",
    "watchfiles",
    "docling",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Linux (the Docker images) takes CPU-only torch wheels instead of the CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore:enable_cleanup_closed ignored:DeprecationWarning:aiohttp",
    "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
    "ignore:This field is deprecated:DeprecationWarning:docling",
]
markers = [
    "unit: no network, no services, no model downloads",
    "integration: requires the Compose stores",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
