services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    build: .
    image: permission-aware-rag:0.1.0
    command: ["uvicorn", "rag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment: &app-stores
      CORPUS_DIR: /app/corpus
      PG_DSN: postgresql://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      INFERENCE_URL: http://inference:8100
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    depends_on: &app-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
      inference:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    image: permission-aware-rag:0.1.0
    command: ["python", "-m", "rag.worker.main"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-stores
      # File events from a host bind mount do not reach the container on every platform.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./corpus:/app/corpus
      - model-cache:/root/.cache/huggingface
    depends_on: *app-depends

  inference:
    profiles: ["app"]
    build: .
    image: permission-aware-rag:0.1.0
    command:
      ["uvicorn", "--factory", "rag.inference.main:app_from_env", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - path: .env
        required: false
    environment:
      # The service runs the models itself, so it never calls another inference service.
      INFERENCE_URL: ""
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pg-data:
  redis-data:
  qdrant-data:
  opensearch-data:
  model-cache:
